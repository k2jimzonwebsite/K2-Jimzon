<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta id="theme-color" name="theme-color" content="#FAF7F2" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const isDark = savedTheme ? savedTheme === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', isDark)
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
          document.querySelector('#theme-color')?.setAttribute('content', isDark ? '#090C15' : '#FAF7F2')
        } catch (_) {
          document.documentElement.style.colorScheme = 'light'
        }
      })()
    </script>
    <title>K2 Jimzon — Italian imports, direct to the Philippines</title>
    <meta
      name="description"
      content="Authentic Italian products, sourced in Italy by our own buyers and flown monthly to Manila. Retail, wholesale, and pasabuy requests — with live stock across every channel."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Archivo:ital,wght@0,400..700;1,400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
